name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Upload packages
        if: matrix.node == 22
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: dist/*.zip
          if-no-files-found: error

  firefox-lint:
    # Advisory: web-ext's rules change between releases, so a new warning
    # should not block unrelated work. Read the output when it fails.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run build
      - run: npx --yes web-ext lint --source-dir dist/firefox
